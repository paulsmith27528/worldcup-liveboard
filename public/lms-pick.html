<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make Your Pick — Last Man Standing</title>
<style>
  :root{
    --bg:#020810; --gold:#ffd54a; --cyan:#22d3ee; --red:#ef4444; --green:#34d399;
    --line:rgba(255,255,255,.08); --dim:#5b6b85;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif;min-height:100vh}
  .wrap{max-width:640px;margin:0 auto;padding:28px 18px 80px}
  .eyebrow{color:var(--red);font-size:11px;font-weight:800;letter-spacing:3px;margin-bottom:6px;text-align:center}
  h1{font-size:24px;font-weight:900;margin:0 0 4px;text-align:center}
  .sub{color:var(--dim);font-size:13px;margin-bottom:26px;text-align:center}

  .deadline{position:relative;border-radius:14px;padding:16px 18px;margin-bottom:22px;background:linear-gradient(150deg,rgba(4,15,34,.97),rgba(2,8,20,.99));border:1px solid rgba(239,68,68,.35)}
  .deadline .lbl{color:var(--red);font-size:11px;font-weight:800;letter-spacing:1.5px;margin-bottom:6px}
  .deadline .time{font-size:18px;font-weight:900}
  .fixtures{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:11px;color:var(--dim);display:flex;flex-wrap:wrap;gap:8px 16px}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
  @media(max-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
  .team{position:relative;border-radius:12px;padding:12px 6px;text-align:center;background:rgba(255,255,255,.03);border:1px solid var(--line);cursor:pointer;transition:.15s}
  .team img{width:28px;height:28px;object-fit:contain;margin-bottom:6px}
  .team .name{font-size:10px;font-weight:700;line-height:1.2}
  .team:hover:not(.used){border-color:rgba(34,211,238,.4)}
  .team.selected{border-color:var(--gold);background:linear-gradient(150deg,rgba(255,213,74,.14),rgba(255,213,74,.04));box-shadow:0 0 20px rgba(255,213,74,.2)}
  .team.selected::after{content:'✓';position:absolute;top:5px;right:7px;color:var(--gold);font-weight:900;font-size:11px}
  .team.used{opacity:.35;cursor:not-allowed;filter:grayscale(1)}
  .team.used::after{content:'USED';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;letter-spacing:1px;color:var(--dim);background:rgba(2,8,20,.6);border-radius:12px}

  .confirm{width:100%;padding:16px;border-radius:12px;border:none;background:linear-gradient(120deg,#ffd54a,#ffb84a);color:#1a1200;font-weight:900;font-size:14px;cursor:pointer}
  .confirm:disabled{opacity:.4;cursor:not-allowed}
  .confirm.confirmed{background:linear-gradient(120deg,#34d399,#10b981);color:#04150e;cursor:default;opacity:1;box-shadow:0 0 20px rgba(52,211,153,.35)}
  .changeBtn{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:transparent;color:#94a3b8;font-weight:700;font-size:13px;cursor:pointer;margin-top:10px}
  .changeBtn:hover{border-color:rgba(255,255,255,.3);color:#fff}

  .msg{text-align:center;padding:40px 20px;color:var(--dim);font-size:13px}
  .state-card{background:linear-gradient(150deg,rgba(4,15,34,.97),rgba(2,8,20,.99));border-radius:16px;padding:32px 20px;text-align:center}
  .state-card .icon{font-size:52px;margin-bottom:14px}
  .state-card h2{margin:0 0 8px;font-size:20px}
  .state-card p{color:var(--dim);font-size:13px;line-height:1.6;margin:0}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:#04150e;font-weight:800;font-size:13px;padding:12px 20px;border-radius:30px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">☠ LAST MAN STANDING</div>
  <h1 id="poolTitle">Loading…</h1>
  <p class="sub" id="subTitle"></p>

  <div id="content"></div>

  <div style="display:flex;gap:10px;margin-top:20px">
    <a id="ladderLink" href="#" style="flex:1;text-align:center;text-decoration:none;padding:12px;border-radius:10px;background:rgba(255,213,74,.08);border:1px solid rgba(255,213,74,.25);color:#ffd54a;font-weight:800;font-size:12px">☠ Ladder</a>
    <a id="tableLink" href="#" style="flex:1;text-align:center;text-decoration:none;padding:12px;border-radius:10px;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.25);color:#22d3ee;font-weight:800;font-size:12px">⚽ Live Table</a>
  </div>
</div>

<div class="toast" id="toast">Confirmation email sent!</div>

<script>
var params = new URLSearchParams(window.location.search);
var poolId = params.get('pool');
var token = params.get('t');
var content = document.getElementById('content');
var currentGwData = null;
var selectedTeam = null;
var justConfirmed = false;

function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function showMsg(text){
  content.innerHTML = '<div class="msg">' + esc(text) + '</div>';
}

function showStateCard(icon, title, text){
  content.innerHTML = '<div class="state-card"><div class="icon">' + icon + '</div><h2>' + esc(title) + '</h2><p>' + esc(text) + '</p></div>';
}

function formatDeadline(iso){
  var d = new Date(iso);
  return d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' }) + ' · ' +
    d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
}

function load(){
  if(!poolId || !token){
    showMsg('This pick link looks incomplete — check the link from your email.');
    return;
  }
  fetch('/api/lms-pick?pool=' + encodeURIComponent(poolId) + '&t=' + encodeURIComponent(token))
    .then(function(r){ return r.json().then(function(d){ return {status:r.status, body:d}; }); })
    .then(function(res){
      if(res.status !== 200){
        document.getElementById('poolTitle').textContent = 'Last Man Standing';
        showMsg(res.body.error || 'Something went wrong loading your pick.');
        return;
      }
      render(res.body);
    })
    .catch(function(){
      showMsg('Something went wrong. Try refreshing the page.');
    });
}

function render(d){
  document.getElementById('poolTitle').textContent = d.poolName;
  currentGwData = d;

  if(d.poolStatus === 'finished'){
    document.getElementById('subTitle').textContent = '';
    var wonIt = d.winner === d.player.name;
    showStateCard(wonIt ? '\uD83D\uDC51' : '\u2620', wonIt ? 'You won!' : 'Pool finished', wonIt
      ? 'You\'re the last one standing — congratulations! This pool is now finished.'
      : (d.winner ? esc(d.winner) + ' won this pool. Thanks for playing!' : 'This pool has finished.'));
    return;
  }

  if(!d.player.alive){
    document.getElementById('subTitle').textContent = '';
    showStateCard('☠', 'You\'re out', 'You were eliminated in Gameweek ' + d.player.eliminatedWeek + '. Thanks for playing — follow along to see who takes it!');
    return;
  }

  if(!d.gw){
    document.getElementById('subTitle').textContent = '';
    showStateCard('⏳', 'No gameweek open yet', 'Check back once the next round of fixtures is confirmed.');
    return;
  }

  var alreadyPicked = d.player.currentPickGw === d.gw && d.player.currentPick;
  document.getElementById('subTitle').textContent = 'Gameweek ' + d.gw + (alreadyPicked ? ' — you picked ' + d.player.currentPick : ' — make your pick');
  selectedTeam = alreadyPicked ? d.player.currentPick : null;
  justConfirmed = !!alreadyPicked;

  var deadlinePassed = new Date() >= new Date(d.deadline);

  var html = '';
  html += '<div class="deadline"><div class="lbl">⏱ PICKS LOCK AT FIRST KICKOFF</div><div class="time">' + formatDeadline(d.deadline) + '</div>';
  html += '<div class="fixtures">';
  d.fixtures.forEach(function(f){
    html += '<span>' + esc(f.home.name) + ' v ' + esc(f.away.name) + '</span>';
  });
  html += '</div></div>';

  if(deadlinePassed){
    html += '<div class="state-card"><div class="icon">🔒</div><h2>Picks are locked</h2><p>The first match of Gameweek ' + d.gw + ' has kicked off. ' + (alreadyPicked ? 'Your pick was: ' + esc(d.player.currentPick) : 'You didn\'t make a pick in time — check with your organiser.') + '</p></div>';
    content.innerHTML = html;
    return;
  }

  html += '<div class="grid" id="teamGrid"></div>';
  html += '<button class="confirm" id="confirmBtn" disabled>Select a team</button>';
  html += '<button class="changeBtn" id="changeBtn" style="display:none" onclick="changePick()">Change Your Pick</button>';
  content.innerHTML = html;

  var grid = document.getElementById('teamGrid');
  d.teams.forEach(function(tm){
    var isUsed = d.player.usedTeams.indexOf(tm.name) !== -1 && tm.name !== selectedTeam;
    var isSel = tm.name === selectedTeam;
    var el = document.createElement('div');
    el.className = 'team' + (isUsed ? ' used' : '') + (isSel ? ' selected' : '');
    el.innerHTML = '<img src="' + tm.logo + '" alt=""><div class="name">' + esc(tm.name) + '</div>';
    if(!isUsed){
      el.addEventListener('click', function(){ selectTeam(tm.name); });
    }
    grid.appendChild(el);
  });

  updateConfirmBtn();
}

function selectTeam(name){
  selectedTeam = name;
  justConfirmed = false;
  document.querySelectorAll('.team').forEach(function(el){
    el.classList.remove('selected');
  });
  Array.prototype.forEach.call(document.getElementById('teamGrid').children, function(el, i){
    if(currentGwData.teams[i].name === name) el.classList.add('selected');
  });
  updateConfirmBtn();
}

function changePick(){
  justConfirmed = false;
  updateConfirmBtn();
}

function updateConfirmBtn(){
  var btn = document.getElementById('confirmBtn');
  var changeBtn = document.getElementById('changeBtn');
  if(!btn) return;

  var currentPick = currentGwData.player.currentPick;
  var isConfirmedState = justConfirmed && selectedTeam && selectedTeam === currentPick;

  if(isConfirmedState){
    btn.disabled = true;
    btn.textContent = 'Pick Confirmed';
    btn.classList.add('confirmed');
    btn.onclick = null;
    if(changeBtn) changeBtn.style.display = 'block';
  } else {
    btn.disabled = !selectedTeam;
    btn.textContent = selectedTeam ? 'Confirm Pick — ' + selectedTeam : 'Select a team';
    btn.classList.remove('confirmed');
    btn.onclick = submitPick;
    if(changeBtn) changeBtn.style.display = 'none';
  }
}

function submitPick(){
  var btn = document.getElementById('confirmBtn');
  btn.disabled = true;
  btn.textContent = 'Submitting…';

  fetch('/api/lms-pick', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ pool: poolId, t: token, team: selectedTeam })
  })
  .then(function(r){ return r.json().then(function(d){ return {status:r.status, body:d}; }); })
  .then(function(res){
    if(res.status !== 200){
      alert(res.body.error || 'Something went wrong submitting your pick.');
      updateConfirmBtn();
      return;
    }
    var toast = document.getElementById('toast');
    toast.style.display = 'block';
    setTimeout(function(){ toast.style.display = 'none'; }, 2000);
    justConfirmed = true;
    load();
  })
  .catch(function(){
    alert('Something went wrong. Please try again.');
    updateConfirmBtn();
  });
}

load();

document.getElementById('ladderLink').href = '/lms-standings.html?pool=' + poolId + '&t=' + token;
document.getElementById('tableLink').href = '/lms-table.html?pool=' + poolId;
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make Your Pick — Last Man Standing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070C14; --bg2:#0B1420;
    --gold:#F2B84B; --gold2:#E2882A;
    --cyan:#5AC8FA; --red:#FF6B57; --green:#4ADE80;
    --line:rgba(255,255,255,.07); --dim:#8A96AC; --text:#F4F1EA;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Manrope',Arial,sans-serif;min-height:100vh}
  .lms-display{font-family:'Bebas Neue','Manrope',sans-serif;letter-spacing:.02em}
  .wrap{max-width:640px;margin:0 auto;padding:28px 18px 80px;position:relative}
  .wrap::before{content:'';position:fixed;top:0;left:0;right:0;height:340px;background:radial-gradient(120% 60% at 50% -10%, rgba(242,184,75,.14), transparent 55%);pointer-events:none;z-index:0}
  .eyebrow{display:flex;align-items:center;justify-content:center;gap:7px;color:var(--dim);font-size:10.5px;font-weight:800;letter-spacing:.16em;margin-bottom:10px;position:relative;z-index:1}
  h1{font-size:26px;font-weight:800;margin:0 0 4px;text-align:center;letter-spacing:-0.01em;position:relative;z-index:1}
  .sub{color:var(--dim);font-size:12.5px;font-weight:600;margin-bottom:26px;text-align:center;position:relative;z-index:1}

  .deadline{position:relative;border-radius:18px;padding:18px 20px;margin-bottom:22px;background:linear-gradient(155deg,var(--bg2),#070D16);border:1px solid var(--line);box-shadow:0 20px 40px -24px rgba(0,0,0,.6);z-index:1}
  .deadline .lbl{color:var(--red);font-size:10px;font-weight:800;letter-spacing:.12em;margin-bottom:8px}
  .deadline .time{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.02em;color:var(--text)}
  .fixtures{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--dim);display:flex;flex-wrap:wrap;gap:8px}
  .fixtures span{background:rgba(255,255,255,.04);padding:5px 10px;border-radius:20px;white-space:nowrap}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;position:relative;z-index:1}
  @media(max-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
  .team{position:relative;border-radius:14px;padding:14px 8px 12px;text-align:center;background:rgba(255,255,255,.03);border:1.5px solid var(--line);cursor:pointer;transition:.15s}
  .team .badge{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
  .team .badge img{width:26px;height:26px;object-fit:contain;margin:0}
  .team .name{font-size:10px;font-weight:700;line-height:1.25;color:var(--text)}
  .team:hover:not(.used){border-color:rgba(90,200,250,.4);transform:translateY(-1px)}
  .team.selected{border-color:var(--gold);background:linear-gradient(155deg,rgba(242,184,75,.14),rgba(242,184,75,.03));box-shadow:0 12px 24px -12px rgba(242,184,75,.35)}
  .team.selected::after{content:'✓';position:absolute;top:7px;right:8px;width:16px;height:16px;border-radius:50%;background:var(--gold);color:#0A1220;font-weight:900;font-size:10px;display:flex;align-items:center;justify-content:center}
  .team.used{opacity:.35;cursor:not-allowed;filter:grayscale(1)}
  .team.used::after{content:'USED';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;letter-spacing:1.5px;color:var(--dim);background:rgba(7,12,20,.72);border-radius:14px}
  .team.preview{opacity:.4;cursor:default;filter:grayscale(.7)}

  .gw-tabs{display:flex;gap:8px;margin-bottom:18px;position:relative;z-index:1}
  .gw-tab{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:rgba(255,255,255,.03);color:var(--dim);font-weight:800;font-size:11.5px;cursor:pointer;text-align:center;transition:.15s}
  .gw-tab.active{border-color:var(--gold);color:var(--gold);background:rgba(242,184,75,.08)}
  .preview-note{border-radius:16px;padding:16px 18px;margin-bottom:20px;background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--dim);font-size:12.5px;line-height:1.6;position:relative;z-index:1}
  .preview-note .fixtures{margin-top:10px;padding-top:10px}

  .confirm{width:100%;padding:17px;border-radius:14px;border:none;background:linear-gradient(120deg,var(--gold),var(--gold2));color:#0A1220;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 16px 30px -14px rgba(242,184,75,.5);position:relative;z-index:1}
  .confirm:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  .confirm.confirmed{background:linear-gradient(120deg,var(--green),#22b573);color:#04150e;cursor:default;opacity:1;box-shadow:0 16px 30px -14px rgba(74,222,128,.45)}
  .changeBtn{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--dim);font-weight:700;font-size:13px;cursor:pointer;margin-top:10px}
  .changeBtn:hover{border-color:rgba(255,255,255,.25);color:var(--text)}

  .joker-toggle{display:flex;align-items:flex-start;gap:12px;padding:15px;border-radius:14px;background:linear-gradient(120deg,rgba(242,184,75,.1),rgba(242,184,75,.02));border:1px solid rgba(242,184,75,.28);margin-bottom:14px;cursor:pointer;position:relative;z-index:1}
  .joker-toggle input{width:20px;height:20px;flex-shrink:0;accent-color:var(--gold);margin-top:1px}
  .joker-toggle .jt-title{display:block;font-weight:800;font-size:13px;color:var(--gold)}
  .joker-toggle .jt-desc{display:block;font-size:11px;color:var(--dim);margin-top:5px;line-height:1.5}
  .joker-used-note{text-align:center;font-size:11px;color:var(--dim);margin-bottom:14px;position:relative;z-index:1}

  .msg{text-align:center;padding:40px 20px;color:var(--dim);font-size:13px;position:relative;z-index:1}
  .state-card{background:linear-gradient(155deg,var(--bg2),#070D16);border:1px solid var(--line);border-radius:18px;padding:34px 22px;text-align:center;position:relative;z-index:1}
  .state-card .icon{font-size:48px;margin-bottom:14px}
  .state-card h2{margin:0 0 8px;font-size:19px;font-weight:800}
  .state-card p{color:var(--dim);font-size:13px;line-height:1.6;margin:0}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:#04150e;font-weight:800;font-size:13px;padding:12px 20px;border-radius:30px;display:none;z-index:2}

  .nav-row{display:flex;gap:8px;margin-top:20px;position:relative;z-index:1}
  .nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;text-decoration:none;padding:11px 4px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--dim);font-weight:700;font-size:9.5px;transition:.15s}
  .nav-tab:hover{border-color:rgba(255,255,255,.2);color:var(--text)}
  .nav-tab svg{width:16px;height:16px}

  .pro-banner{display:block;text-align:center;text-decoration:none;padding:13px;border-radius:14px;font-weight:800;font-size:12px;margin-top:12px;position:relative;z-index:1}
  .pro-banner.active{background:rgba(242,184,75,.08);border:1px solid rgba(242,184,75,.25);color:var(--gold)}
  .pro-banner.upsell{background:linear-gradient(120deg,var(--gold),var(--gold2));color:#0A1220;box-shadow:0 14px 26px -14px rgba(242,184,75,.45)}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow" id="eyebrow">☠ LAST MAN STANDING</div>
  <h1 id="poolTitle">Loading…</h1>
  <p class="sub" id="subTitle"></p>

  <div class="gw-tabs" id="gwTabs" style="display:none">
    <button class="gw-tab" id="tabCurrent">Gameweek</button>
    <button class="gw-tab" id="tabNext">Gameweek</button>
  </div>

  <div id="content"></div>

  <div class="nav-row">
    <a id="ladderLink" href="#" class="nav-tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
      <span>Arena</span>
    </a>
    <a id="matchdayLink" href="#" class="nav-tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <span>Match Day</span>
    </a>
    <a id="tableLink" href="#" class="nav-tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="10" width="4" height="10"/><rect x="10" y="6" width="4" height="14"/><rect x="17" y="3" width="4" height="17"/></svg>
      <span>Live Table</span>
    </a>
  </div>

  <div id="proBanner" style="display:none;margin-top:12px"></div>
</div>

<div class="toast" id="toast">Confirmation email sent!</div>

<script>
var params = new URLSearchParams(window.location.search);
var poolId = params.get('pool');
var token = params.get('t');
var content = document.getElementById('content');
var currentGwData = null;
var selectedTeam = null;
var selectedJoker = false;
var justConfirmed = false;
var activeTab = 'current'; // 'current' or 'next' — which gameweek's fixtures are showing

function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function showMsg(text){
  content.innerHTML = '<div class="msg">' + esc(text) + '</div>';
}

function showStateCard(icon, title, text){
  content.innerHTML = '<div class="state-card"><div class="icon">' + icon + '</div><h2>' + esc(title) + '</h2><p>' + esc(text) + '</p></div>';
}

function formatDeadline(iso){
  var d = new Date(iso);
  return d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' }) + ' · ' +
    d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
}

function load(){
  if(!poolId || !token){
    showMsg('This pick link looks incomplete — check the link from your email.');
    return;
  }
  fetch('/api/lms-pick?pool=' + encodeURIComponent(poolId) + '&t=' + encodeURIComponent(token))
    .then(function(r){ return r.json().then(function(d){ return {status:r.status, body:d}; }); })
    .then(function(res){
      if(res.status !== 200){
        document.getElementById('poolTitle').textContent = 'Last Man Standing';
        showMsg(res.body.error || 'Something went wrong loading your pick.');
        return;
      }
      render(res.body);
    })
    .catch(function(){
      showMsg('Something went wrong. Try refreshing the page.');
    });
}

function render(d){
  document.getElementById('poolTitle').textContent = d.poolName;
  document.getElementById('eyebrow').textContent = '☠ LAST MAN STANDING · ' + (d.leagueName || 'Premier League').toUpperCase();
  currentGwData = d;

  var proBanner = document.getElementById('proBanner');
  if(d.player.proPaid){
    proBanner.style.display = 'block';
    proBanner.innerHTML = '<div class="pro-banner active">⭐ You\'re Pro</div>';
  } else {
    proBanner.style.display = 'block';
    proBanner.innerHTML = '<a href="/api/lms-pro-checkout?pool=' + encodeURIComponent(poolId) + '&t=' + encodeURIComponent(token) + '" class="pro-banner upsell">⭐ Go Pro — £1 · React &amp; see pick popularity</a>';
  }

  document.getElementById('gwTabs').style.display = 'none';

  if(d.poolStatus === 'finished'){
    document.getElementById('subTitle').textContent = '';
    var wonIt = d.winner === d.player.name;
    showStateCard(wonIt ? '\uD83D\uDC51' : '\u2620', wonIt ? 'You won!' : 'Pool finished', wonIt
      ? 'You\'re the last one standing — congratulations! This pool is now finished.'
      : (d.winner ? esc(d.winner) + ' won this pool. Thanks for playing!' : 'This pool has finished.'));
    return;
  }

  if(!d.player.alive){
    document.getElementById('subTitle').textContent = '';
    showStateCard('☠', 'You\'re out', 'You were eliminated in Gameweek ' + d.player.eliminatedWeek + '. Thanks for playing — follow along to see who takes it!');
    return;
  }

  if(!d.gw){
    document.getElementById('subTitle').textContent = '';
    showStateCard('⏳', 'No gameweek open yet', 'Check back once the next round of fixtures is confirmed.');
    return;
  }

  renderTabs(d);

  if(activeTab === 'next' && d.nextGw){
    renderNextPreview(d);
  } else {
    activeTab = 'current';
    renderCurrentWeek(d);
  }
}

function renderTabs(d){
  var tabs = document.getElementById('gwTabs');
  if(!d.nextGw){
    tabs.style.display = 'none';
    return;
  }
  tabs.style.display = 'flex';
  var tabCurrent = document.getElementById('tabCurrent');
  var tabNext = document.getElementById('tabNext');
  tabCurrent.textContent = 'Gameweek ' + d.gw;
  tabNext.textContent = 'Gameweek ' + d.nextGw;
  tabCurrent.className = 'gw-tab' + (activeTab === 'current' ? ' active' : '');
  tabNext.className = 'gw-tab' + (activeTab === 'next' ? ' active' : '');
}

function renderNextPreview(d){
  document.getElementById('subTitle').textContent = 'Gameweek ' + d.nextGw + ' — preview';

  var html = '<div class="preview-note">🔒 Picks for Gameweek ' + d.nextGw + ' open once Gameweek ' + d.gw + ' is fully finished and graded. Here\'s a preview of the fixtures:<div class="fixtures">';
  d.nextFixtures.forEach(function(f){
    html += '<span>' + esc(f.home.name) + ' v ' + esc(f.away.name) + '</span>';
  });
  html += '</div></div>';

  html += '<div class="grid">';
  d.teams.forEach(function(tm){
    html += '<div class="team preview"><div class="badge"><img src="' + tm.logo + '" alt=""></div><div class="name">' + esc(tm.name) + '</div></div>';
  });
  html += '</div>';

  content.innerHTML = html;
}

function renderCurrentWeek(d){
  var alreadyPicked = d.player.currentPickGw === d.gw && d.player.currentPick;
  document.getElementById('subTitle').textContent = 'Gameweek ' + d.gw + (alreadyPicked ? ' — you picked ' + d.player.currentPick : ' — make your pick');
  selectedTeam = alreadyPicked ? d.player.currentPick : null;
  selectedJoker = alreadyPicked && !!d.player.currentPickJoker;
  justConfirmed = !!alreadyPicked;

  var deadlinePassed = new Date() >= new Date(d.deadline);

  var html = '';
  html += '<div class="deadline"><div class="lbl">⏱ PICKS LOCK AT FIRST KICKOFF</div><div class="time">' + formatDeadline(d.deadline) + '</div>';
  html += '<div class="fixtures">';
  d.fixtures.forEach(function(f){
    html += '<span>' + esc(f.home.name) + ' v ' + esc(f.away.name) + '</span>';
  });
  html += '</div></div>';

  if(deadlinePassed){
    html += '<div class="state-card"><div class="icon">🔒</div><h2>Picks are locked</h2><p>The first match of Gameweek ' + d.gw + ' has kicked off. ' + (alreadyPicked ? 'Your pick was: ' + esc(d.player.currentPick) : 'You didn\'t make a pick in time — check with your organiser.') + '</p></div>';
    content.innerHTML = html;
    return;
  }

  html += '<div class="grid" id="teamGrid"></div>';

  if(d.player.hasJoker){
    html += '<label class="joker-toggle" for="jokerCheck"><input type="checkbox" id="jokerCheck"' + (selectedJoker ? ' checked' : '') + ' onchange="selectedJoker = this.checked; updateConfirmBtn();">' +
      '<span><span class="jt-title">🛡️ Play my joker on this pick</span>' +
      '<span class="jt-desc">No confidence in this one? Play your joker as insurance — if it loses or draws, you survive instead of being knocked out. It\'s used up the moment you play it, win or lose.</span></span></label>';
  } else if(d.player.jokerUsedWeek !== null){
    html += '<div class="joker-used-note">🛡️ Your joker was used in Gameweek ' + d.player.jokerUsedWeek + ' — none left.</div>';
  }

  html += '<button class="confirm" id="confirmBtn" disabled>Select a team</button>';
  html += '<button class="changeBtn" id="changeBtn" style="display:none" onclick="changePick()">Change Your Pick</button>';
  content.innerHTML = html;

  var grid = document.getElementById('teamGrid');
  d.teams.forEach(function(tm){
    var isUsed = d.player.usedTeams.indexOf(tm.name) !== -1 && tm.name !== selectedTeam;
    var isSel = tm.name === selectedTeam;
    var el = document.createElement('div');
    el.className = 'team' + (isUsed ? ' used' : '') + (isSel ? ' selected' : '');
    el.innerHTML = '<div class="badge"><img src="' + tm.logo + '" alt=""></div><div class="name">' + esc(tm.name) + '</div>';
    if(!isUsed){
      el.addEventListener('click', function(){ selectTeam(tm.name); });
    }
    grid.appendChild(el);
  });

  updateConfirmBtn();
}

function selectTeam(name){
  selectedTeam = name;
  justConfirmed = false;
  document.querySelectorAll('.team').forEach(function(el){
    el.classList.remove('selected');
  });
  Array.prototype.forEach.call(document.getElementById('teamGrid').children, function(el, i){
    if(currentGwData.teams[i].name === name) el.classList.add('selected');
  });
  updateConfirmBtn();
}

function changePick(){
  justConfirmed = false;
  updateConfirmBtn();
}

function updateConfirmBtn(){
  var btn = document.getElementById('confirmBtn');
  var changeBtn = document.getElementById('changeBtn');
  if(!btn) return;

  var currentPick = currentGwData.player.currentPick;
  var currentPickJoker = !!currentGwData.player.currentPickJoker;
  var isConfirmedState = justConfirmed && selectedTeam && selectedTeam === currentPick && selectedJoker === currentPickJoker;

  if(isConfirmedState){
    btn.disabled = true;
    btn.textContent = 'Pick Confirmed' + (selectedJoker ? ' 🛡️' : '');
    btn.classList.add('confirmed');
    btn.onclick = null;
    if(changeBtn) changeBtn.style.display = 'block';
  } else {
    btn.disabled = !selectedTeam;
    btn.textContent = selectedTeam ? 'Confirm Pick — ' + selectedTeam + (selectedJoker ? ' 🛡️' : '') : 'Select a team';
    btn.classList.remove('confirmed');
    btn.onclick = submitPick;
    if(changeBtn) changeBtn.style.display = 'none';
  }
}

function submitPick(){
  var btn = document.getElementById('confirmBtn');
  btn.disabled = true;
  btn.textContent = 'Submitting…';

  fetch('/api/lms-pick', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ pool: poolId, t: token, team: selectedTeam, useJoker: selectedJoker })
  })
  .then(function(r){ return r.json().then(function(d){ return {status:r.status, body:d}; }); })
  .then(function(res){
    if(res.status !== 200){
      alert(res.body.error || 'Something went wrong submitting your pick.');
      updateConfirmBtn();
      return;
    }
    var toast = document.getElementById('toast');
    toast.style.display = 'block';
    setTimeout(function(){ toast.style.display = 'none'; }, 2000);
    justConfirmed = true;
    load();
  })
  .catch(function(){
    alert('Something went wrong. Please try again.');
    updateConfirmBtn();
  });
}

document.getElementById('tabCurrent').addEventListener('click', function(){
  if(activeTab === 'current') return;
  activeTab = 'current';
  render(currentGwData);
});
document.getElementById('tabNext').addEventListener('click', function(){
  if(activeTab === 'next') return;
  activeTab = 'next';
  render(currentGwData);
});

load();

document.getElementById('ladderLink').href = '/lms-arena.html?pool=' + poolId + '&t=' + token;
document.getElementById('matchdayLink').href = '/lms-matchday.html?pool=' + poolId + '&t=' + token;
document.getElementById('tableLink').href = '/lms-table.html?pool=' + poolId + '&t=' + token;
</script>
</body>
</html>

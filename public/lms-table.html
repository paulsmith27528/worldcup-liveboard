<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no, address=no, email=no, date=no, url=no">
<title>Live Table — Last Man Standing</title>
<style>
  :root{
    --bg:#020810; --gold:#ffd54a; --cyan:#22d3ee; --red:#ef4444; --green:#34d399; --dim:#5b6b85;
    --line:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif;min-height:100vh}
  .wrap{max-width:640px;margin:0 auto;padding:28px 16px 80px}
  .eyebrow{color:var(--red);font-size:11px;font-weight:800;letter-spacing:3px;margin-bottom:6px;text-align:center}
  h1{font-size:24px;font-weight:900;margin:0 0 4px;text-align:center}
  .sub{color:var(--dim);font-size:13px;margin-bottom:24px;text-align:center}
  .loading{text-align:center;color:var(--dim);font-size:13px;padding:60px 20px}
  .empty{text-align:center;color:var(--dim);font-size:13px;padding:20px}

  .pl-table{width:100%;border-collapse:collapse;font-size:12px}
  .pl-table th{text-align:left;color:var(--dim);font-weight:800;font-size:9px;letter-spacing:.5px;padding:8px 4px;border-bottom:1px solid var(--line)}
  .pl-table td{padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.04)}
  .pos{color:var(--dim);width:20px}
  .team-cell{display:flex;align-items:center;gap:8px;font-weight:700}
  .team-cell img{width:20px;height:20px;object-fit:contain;flex-shrink:0}
  .reserve-pill{display:inline-flex;align-items:center;gap:4px;background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.25);color:var(--cyan);padding:3px 8px;border-radius:20px;font-weight:800;font-size:10px;white-space:nowrap}
  .reserve-pill.low{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:var(--red)}
  .note{color:var(--dim);font-size:11px;text-align:center;margin-top:20px;line-height:1.6}
  .nav-row{display:flex;gap:10px;margin-top:24px}
  .nav-row a{flex:1;text-align:center;text-decoration:none;padding:12px;border-radius:10px;font-weight:800;font-size:12px}
  .pro-gate{ text-align:center; padding:40px 24px; }
  .pro-gate .icon{ font-size:40px; margin-bottom:14px; }
  .pro-gate h2{ font-size:18px; margin:0 0 8px; color:#fff; }
  .pro-gate p{ color:var(--dim); font-size:13px; line-height:1.6; margin:0 0 22px; }
  .pro-gate .cta{ display:block; width:100%; padding:13px; margin-top:10px; border-radius:12px; background:var(--gold); color:#1a1200; border:none; font-weight:800; font-size:13px; text-decoration:none; }
  .pro-gate .ghost-btn{
    display:block; width:100%; padding:13px; margin-top:10px; border-radius:12px;
    background:transparent; border:1px solid rgba(148,163,184,.3); color:var(--dim);
    font-weight:700; font-size:13px; text-decoration:none; cursor:pointer;
  }
  .pro-gate .find-form{ margin-top:18px; text-align:left; }
  .pro-gate .find-label{ font-size:11.5px; color:var(--dim); margin-bottom:8px; text-align:center; line-height:1.5; }
  .pro-gate .find-input{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:rgba(255,255,255,.04); color:#fff; font-size:14px; margin-bottom:10px;
  }
  .pro-gate .find-input:focus{ outline:none; border-color:var(--gold); }
  .pro-gate .find-err{ color:var(--red); font-size:12px; margin-top:8px; display:none; line-height:1.5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow" id="eyebrow">⚽ LIVE TABLE</div>
  <h1 id="poolTitle">Loading…</h1>
  <p class="sub" id="poolSub"></p>
  <div id="content"><div class="loading">Loading table…</div></div>
</div>

<script>
var params = new URLSearchParams(window.location.search);
var poolId = params.get('pool');
var token = params.get('t');

function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function renderProGate(upgradeUrl, fallbackUrl){
  var findFormHtml = '<div class="find-form">' +
      '<div class="find-label">We couldn\'t identify you from this link. Enter the email you joined with and we\'ll find your upgrade link:</div>' +
      '<input type="email" class="find-input" id="findEmail" placeholder="you@example.com">' +
      '<button class="cta" style="margin-top:0" onclick="findMyLink()" id="findBtn">Find My Link</button>' +
      '<p class="find-err" id="findErr"></p>' +
    '</div>';
  var html = '<div class="pro-gate">' +
    '<div class="icon">⭐</div>' +
    '<h2>The Live Table is a Pro feature</h2>' +
    '<p>Upgrade for £1 to unlock the live table, including Reserve counts, for yourself — or carry on with the free plain-text ladder instead.</p>' +
    (upgradeUrl ? '<a class="cta" href="' + esc(upgradeUrl) + '">Go Pro — £1</a>' : findFormHtml) +
    '<a class="ghost-btn" href="' + esc(fallbackUrl) + '">Continue to free ladder &rarr;</a>' +
    '</div>';
  document.getElementById('content').innerHTML = html;
}

function findMyLink(){
  var email = document.getElementById('findEmail').value.trim();
  var errEl = document.getElementById('findErr');
  var btn = document.getElementById('findBtn');
  errEl.style.display = 'none';
  if(!email || !/^[^@]+@[^@]+\.[^@]+$/.test(email)){
    errEl.textContent = 'Please enter a valid email address.';
    errEl.style.display = 'block';
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Looking…';
  fetch('/api/lms-find-token', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ pool: poolId, email: email })
  })
  .then(function(r){ return r.json().then(function(d){ return {status:r.status, body:d}; }); })
  .then(function(res){
    if(res.status !== 200){
      btn.disabled = false;
      btn.textContent = 'Find My Link';
      errEl.textContent = "We couldn't find that email in this pool — try the personal link from your join confirmation email instead, or ask your organiser to resend it.";
      errEl.style.display = 'block';
      return;
    }
    window.location.href = '/api/lms-pro-checkout?pool=' + encodeURIComponent(poolId) + '&t=' + encodeURIComponent(res.body.token);
  })
  .catch(function(){
    btn.disabled = false;
    btn.textContent = 'Find My Link';
    errEl.textContent = 'Something went wrong. Please try again.';
    errEl.style.display = 'block';
  });
}

if(!poolId){
  document.getElementById('content').innerHTML = '<div class="empty">No pool specified.</div>';
} else {
  fetch('/api/lms-table?pool=' + encodeURIComponent(poolId) + (token ? '&t=' + encodeURIComponent(token) : ''))
    .then(function(r){ return r.json().then(function(d){ return {status:r.status, body:d}; }); })
    .then(function(res){
      if(res.status !== 200){
        if(res.body.error === 'pro_required'){
          renderProGate(res.body.upgradeUrl, res.body.fallbackUrl);
          return;
        }
        document.getElementById('content').innerHTML = '<div class="empty">' + esc(res.body.error || 'Something went wrong loading the table.') + '</div>';
        return;
      }
      render(res.body);
    })
    .catch(function(){
      document.getElementById('content').innerHTML = '<div class="empty">Something went wrong. Try refreshing.</div>';
    });
}

function reserveCellHtml(row){
  var pillClass = row.reserveCount <= 2 ? 'reserve-pill low' : 'reserve-pill';
  return '<span class="' + pillClass + '">🎯 ' + row.reserveCount + ' left</span>';
}

function render(d){
  document.getElementById('poolTitle').textContent = d.poolName || 'Live Table';
  document.getElementById('poolSub').textContent = d.aliveCount + ' players still picking';
  if(d.leagueName){
    document.getElementById('eyebrow').textContent = '⚽ LIVE TABLE · ' + d.leagueName.toUpperCase();
  }

  if(!d.table || d.table.length === 0){
    document.getElementById('content').innerHTML = '<div class="empty">No standings available yet — check back once the season\'s underway.</div>';
    return;
  }

  var html = '<table class="pl-table"><tr><th class="pos">#</th><th>Team</th><th>P</th><th>GD</th><th>Pts</th><th>Reserve</th></tr>';
  d.table.forEach(function(row){
    html += '<tr>' +
      '<td class="pos">' + row.rank + '</td>' +
      '<td><div class="team-cell"><img src="' + row.logo + '" alt="">' + esc(row.team) + '</div></td>' +
      '<td>' + row.played + '</td>' +
      '<td>' + (row.goalDiff > 0 ? '+' : '') + row.goalDiff + '</td>' +
      '<td>' + row.points + '</td>' +
      '<td>' + reserveCellHtml(row) + '</td>' +
      '</tr>';
  });
  html += '</table>';
  html += '<p class="note">"Reserve" shows how many players still in the pool haven\'t used that team yet — useful to know before you spend a strong one.</p>';

  if(token){
    html += '<div class="nav-row">' +
      '<a href="/lms-pick.html?pool=' + poolId + '&t=' + token + '" style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#94a3b8">← Pick</a>' +
      '<a href="/lms-arena.html?pool=' + poolId + '&t=' + token + '" style="background:rgba(255,213,74,.08);border:1px solid rgba(255,213,74,.25);color:#ffd54a">☠ Arena</a>' +
      '<a href="/lms-matchday.html?pool=' + poolId + '&t=' + token + '" style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);color:#ef4444">⚡ Match Day</a>' +
      '</div>';
  }

  document.getElementById('content').innerHTML = html;
}
</script>
</body>
</html>

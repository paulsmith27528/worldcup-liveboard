<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no, address=no, email=no, date=no, url=no">
<title>Share Your Pool Link</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#020810;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .wrap{max-width:440px;padding:32px 20px;text-align:center}
  .icon{font-size:52px;margin-bottom:16px}
  h1{font-size:22px;font-weight:900;margin:0 0 10px}
  p{color:#94a3b8;font-size:14px;line-height:1.6;margin:0 0 24px}
  .joinbox{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:14px;margin-bottom:20px;display:flex;align-items:center;gap:10px}
  .joinbox input{flex:1;width:100%;text-align:left;background:transparent;border:none;outline:none;color:#22d3ee;font-size:12px;font-family:Arial,sans-serif;pointer-events:none}
  .copyBtn{flex-shrink:0;padding:8px 12px;border:none;border-radius:8px;background:rgba(255,213,74,.15);color:#ffd54a;font-weight:800;font-size:11px;cursor:pointer;border:1px solid rgba(255,213,74,.3)}
  button{width:100%;padding:16px;border:none;border-radius:12px;background:linear-gradient(120deg,#ffd54a,#ffb84a);color:#1a1200;font-weight:900;font-size:14px;cursor:pointer;margin-bottom:10px}
  .copied{color:#34d399;font-size:12px;margin-top:8px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="icon">☠</div>
  <h1 id="title">Share Your Pool</h1>
  <p id="sub">Loading…</p>

  <div class="joinbox" onclick="doShare()" style="cursor:pointer">
    <input id="joinLink" type="text" readonly tabindex="-1">
    <button class="copyBtn" onclick="event.stopPropagation();copyLink()">Copy</button>
  </div>

  <button id="shareBtn" onclick="doShare()">Share Join Link →</button>
  <div class="copied" id="copiedMsg">Link copied!</div>
</div>

<script>
var params = new URLSearchParams(window.location.search);
var poolId = params.get('pool');
var joinUrl = window.location.origin + '/lms-join.html?pool=' + poolId;
document.getElementById('joinLink').value = joinUrl;
document.getElementById('sub').textContent = 'Send this to everyone you want in your Last Man Standing pool.';

function copyLink(){
  navigator.clipboard.writeText(joinUrl).then(function(){
    document.getElementById('copiedMsg').style.display = 'block';
    setTimeout(function(){ document.getElementById('copiedMsg').style.display = 'none'; }, 2000);
  });
}

function doShare(){
  if(navigator.share){
    navigator.share({
      title: 'Join my Last Man Standing pool',
      text: 'One wrong pick and you\'re out — winner takes all. Join my pool:',
      url: joinUrl
    }).catch(function(){});
  } else {
    navigator.clipboard.writeText(joinUrl).then(function(){
      document.getElementById('copiedMsg').style.display = 'block';
      setTimeout(function(){ document.getElementById('copiedMsg').style.display = 'none'; }, 2000);
    });
  }
}

// Auto-trigger the native share sheet as soon as the page loads (if supported)
if(navigator.share && poolId){
  setTimeout(doShare, 300);
}
</script>
</body>
</html>

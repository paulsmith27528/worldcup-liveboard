<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no, address=no, email=no, date=no, url=no">
<title>Weekly Recap — Last Man Standing</title>
<style>
  :root{
    --bg:#020810; --gold:#ffd54a; --cyan:#22d3ee; --red:#ef4444; --green:#34d399; --dim:#5b6b85;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .loading{color:var(--dim);font-size:13px}
  .recap-card{width:340px;background:linear-gradient(160deg,#0a0118,#020810 60%);border:1px solid rgba(239,68,68,.3);border-radius:24px;padding:28px 24px;position:relative;overflow:hidden;display:none}
  .recap-card::before{content:'';position:absolute;top:-60px;right:-60px;width:180px;height:180px;background:radial-gradient(circle,rgba(239,68,68,.25),transparent 70%)}
  .recap-eyebrow{color:var(--red);font-size:10px;font-weight:900;letter-spacing:2px;margin-bottom:4px}
  .recap-title{font-size:22px;font-weight:900;margin-bottom:2px}
  .recap-pool{color:var(--dim);font-size:12px;margin-bottom:20px}
  .recap-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px}
  .recap-stat{background:rgba(255,255,255,.04);border-radius:12px;padding:12px 6px;text-align:center}
  .recap-stat .n{font-size:22px;font-weight:900}
  .recap-stat .l{font-size:8px;color:var(--dim);font-weight:800;letter-spacing:.5px;margin-top:2px}
  .recap-list{background:rgba(255,255,255,.03);border-radius:12px;padding:14px;margin-bottom:16px}
  .recap-list .row{display:flex;justify-content:space-between;font-size:11px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .recap-list .row:last-child{border:none}
  .recap-foot{text-align:center;color:var(--dim);font-size:10px}
  .recap-foot b{color:var(--gold)}
  .hint{text-align:center;color:var(--dim);font-size:11px;margin-top:16px;max-width:340px}
</style>
</head>
<body>
<div class="loading" id="loadingMsg">Loading recap…</div>
<div>
  <div class="recap-card" id="card">
    <div class="recap-eyebrow">☠ LAST MAN STANDING</div>
    <div class="recap-title" id="cardTitle">Gameweek Recap</div>
    <div class="recap-pool" id="cardPool"></div>
    <div class="recap-stats" id="cardStats"></div>
    <div class="recap-list" id="cardList"></div>
    <div class="recap-foot" id="cardFoot"></div>
  </div>
  <button id="waBtn" style="display:none;width:340px;max-width:100%;margin:16px auto 0;padding:14px;border-radius:12px;background:#25D366;color:#fff;border:none;font-weight:900;font-size:14px;cursor:pointer">Share results on WhatsApp</button>
  <p class="hint" id="cardHint" style="display:none">Or screenshot this card to share in your group chat.</p>
</div>

<script>
var params = new URLSearchParams(window.location.search);
var poolId = params.get('pool');
var gwParam = params.get('gw');

function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML.replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

if(!poolId){
  document.getElementById('loadingMsg').textContent = 'No pool specified.';
} else {
  var url = '/api/lms-recap?pool=' + encodeURIComponent(poolId) + (gwParam ? '&gw=' + encodeURIComponent(gwParam) : '');
  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d.gw || !d.recap){
        document.getElementById('loadingMsg').textContent = 'No gameweek has finished yet for this pool.';
        return;
      }
      render(d);
    })
    .catch(function(){
      document.getElementById('loadingMsg').textContent = 'Something went wrong loading the recap.';
    });
}

function render(d){
  document.getElementById('loadingMsg').style.display = 'none';
  document.getElementById('card').style.display = 'block';
  document.getElementById('cardHint').style.display = 'block';

  document.getElementById('cardTitle').textContent = 'Gameweek ' + d.gw + ' Recap';
  document.getElementById('cardPool').textContent = d.poolName || '';

  var r = d.recap;
  var statsHtml = '';
  if(r.wipeout){
    statsHtml += '<div class="recap-stat"><div class="n" style="color:var(--gold)">\uD83C\uDF00</div><div class="l">WIPEOUT</div></div>';
    statsHtml += '<div class="recap-stat"><div class="n" style="color:var(--green)">' + r.survivedCount + '</div><div class="l">SURVIVED</div></div>';
    statsHtml += '<div class="recap-stat"><div class="n" style="color:var(--red)">0</div><div class="l">OUT</div></div>';
  } else {
    statsHtml += '<div class="recap-stat"><div class="n" style="color:var(--green)">' + r.survivedCount + '</div><div class="l">SURVIVED</div></div>';
    statsHtml += '<div class="recap-stat"><div class="n" style="color:var(--gold)">' + r.jokerUsedNames.length + '</div><div class="l">USED JOKER</div></div>';
    statsHtml += '<div class="recap-stat"><div class="n" style="color:var(--red)">' + r.eliminatedNames.length + '</div><div class="l">OUT</div></div>';
  }
  document.getElementById('cardStats').innerHTML = statsHtml;

  var listHtml = '';
  if(r.wipeout){
    listHtml += '<div class="row"><span>Everyone picked a loser or draw</span><span>\uD83D\uDE05</span></div>';
    listHtml += '<div class="row"><span>Week voided — no eliminations</span><span>\u2618</span></div>';
  } else {
    if(r.eliminatedNames.length > 0){
      listHtml += '<div class="row"><span>Out this week</span><span>' + esc(r.eliminatedNames.join(', ')) + '</span></div>';
    }
    if(r.jokerUsedNames.length > 0){
      listHtml += '<div class="row"><span>Used their joker</span><span>' + esc(r.jokerUsedNames.join(', ')) + '</span></div>';
    }
    if(r.eliminatedNames.length === 0 && r.jokerUsedNames.length === 0){
      listHtml += '<div class="row"><span>Clean sweep — everyone picked a winner</span><span>\uD83D\uDD25</span></div>';
    }
  }
  listHtml += r.stillAliveCount === 1
    ? '<div class="row"><span>We have a winner</span><span>\uD83D\uDC51</span></div>'
    : '<div class="row"><span>' + r.stillAliveCount + ' players remain</span><span>Next: GW' + (d.gw + 1) + '</span></div>';
  document.getElementById('cardList').innerHTML = listHtml;

  document.getElementById('cardFoot').textContent = r.stillAliveCount + ' still standing';

  var waBtn = document.getElementById('waBtn');
  waBtn.style.display = 'block';
  waBtn.onclick = function(){
    window.open('https://wa.me/?text=' + encodeURIComponent(whatsAppText(d)), '_blank');
  };
}

// Plain-text version of the card for WhatsApp. Long name lists are
// shortened to a count so a big pool's message stays readable.
function nameList(names){
  return names.length <= 10 ? names.join(', ') : names.length + ' players';
}
function whatsAppText(d){
  var r = d.recap;
  var lines = ['☠ ' + (d.poolName || 'Last Man Standing') + ': Gameweek ' + d.gw + ' results'];
  if(r.wipeout){
    lines.push('♻️ Total wipeout! Everyone lost or drew, so nobody is out this week.');
  } else {
    lines.push('✅ ' + r.survivedCount + ' survived · ❌ ' + r.eliminatedNames.length + ' out');
    if(r.eliminatedNames.length) lines.push('Out: ' + nameList(r.eliminatedNames));
    if(r.jokerUsedNames.length) lines.push('🛡 Joker used: ' + nameList(r.jokerUsedNames));
  }
  lines.push(r.stillAliveCount + ' still standing. Next up: Gameweek ' + (d.gw + 1) + '.');
  lines.push('Full table: ' + window.location.origin + '/lms-players.html?pool=' + encodeURIComponent(poolId));
  return lines.join('\n');
}
</script>
</body>
</html>

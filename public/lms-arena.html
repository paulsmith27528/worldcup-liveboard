<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no, address=no, email=no, date=no, url=no">
<title>The Arena — Last Man Standing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#070C14;
    --navy:#0B1420;
    --navy-elevated:#131D30;
    --navy-line:#1E2C46;
    --gold:#F2B84B;
    --gold-bright:#F8CE72;
    --text:#F4F1EA;
    --muted:#8A96AC;
    --eliminated:#26314A;
    --eliminated-text:#4B5A7A;
    --out-red:#FF6B57;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:var(--navy-deep);
    color:var(--text);
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .lms-display{ font-family:'Bebas Neue','Manrope',sans-serif; letter-spacing:0.02em; }
  body{display:flex; justify-content:center;}
  .phone{
    width:100%; max-width:430px; min-height:100vh;
    background:
      radial-gradient(ellipse 600px 300px at 50% -10%, rgba(216,178,76,0.10), transparent 60%),
      var(--navy-deep);
    display:flex; flex-direction:column; position:relative; overflow-x:hidden;
  }
  .topbar{
    padding:18px 20px 14px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--navy-line);
  }
  .brand{ font-size:15px; font-weight:800; letter-spacing:0.04em; color:var(--gold-bright); text-transform:uppercase; }
  .brand span{ color:var(--muted); font-weight:600; font-size:11px; letter-spacing:0.06em; display:block; margin-top:2px; text-transform:none; }
  .round-pill{
    font-size:11px; color:var(--navy-deep); background:var(--gold); padding:6px 12px;
    border-radius:20px; font-weight:800; letter-spacing:0.03em; white-space:nowrap;
  }
  .hero{ padding:22px 20px 8px; text-align:center; }
  .hero-count{ font-size:56px; font-weight:900; line-height:0.9; color:var(--gold-bright); text-shadow:0 0 40px rgba(243,210,122,0.35); }
  .hero-label{ font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); margin-top:6px; font-weight:700; }
  .hero-sub{ font-size:12px; color:var(--muted); margin-top:10px; }
  .hero-sub b{ color:var(--text); font-weight:700; }

  .legend{ display:flex; flex-wrap:wrap; gap:14px; padding:10px 20px; font-size:10px; color:var(--muted); border-bottom:1px solid var(--navy-line); }
  .legend-item{ display:flex; align-items:center; gap:5px; }
  .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .dot.alive{ background:var(--navy-elevated); border:1.5px solid var(--gold); }
  .dot.you{ background:var(--navy-elevated); border:1.5px solid var(--gold-bright); box-shadow:0 0 0 2px var(--gold-bright); }
  .dot.eliminated{ background:var(--eliminated); opacity:0.6; }
  .dot.life{ background:var(--navy-elevated); border:1.5px solid var(--gold); position:relative; }

  .jump-btn{
    margin:12px 20px 0; padding:10px 14px; background:rgba(216,178,76,0.08); border:1px solid rgba(216,178,76,0.25);
    border-radius:10px; color:var(--gold-bright); font-size:12px; font-weight:700; text-align:center; cursor:pointer;
  }

  .arena{ flex:1; padding:18px 0 90px; display:flex; flex-direction:column-reverse; gap:10px; position:relative; }

  .rung{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; scroll-margin-top:24px; }
  .rung-meta{ display:flex; align-items:center; gap:8px; font-size:10.5px; color:var(--muted); letter-spacing:0.04em; font-weight:600; }
  .rung-current .rung-meta{ color:var(--gold); }

  .row{ display:flex; justify-content:center; flex-wrap:wrap; gap:22px 16px; max-width:380px; padding:8px 12px; }

  .avatar{
    width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:13px; flex-shrink:0; position:relative;
  }
  .avatar-img{ position:absolute; inset:0; width:100%; height:100%; border-radius:50%; object-fit:cover; }
  .avatar.alive{ background:linear-gradient(145deg, var(--navy-elevated), var(--navy)); color:var(--gold-bright); border:1.5px solid var(--gold); }
  .avatar.eliminated{ background:var(--eliminated); color:var(--eliminated-text); border:1.5px solid transparent; opacity:0.6; }
  .avatar.eliminated::after{
    content:""; position:absolute; inset:0; border-radius:50%;
    background:repeating-linear-gradient(135deg, transparent, transparent 3px, rgba(180,69,61,0.35) 3px, rgba(180,69,61,0.35) 4px);
  }
  .avatar.you{ box-shadow:0 0 0 2.5px var(--navy-deep), 0 0 0 4px var(--gold-bright); }
  .avatar.hidden{ background:var(--navy-elevated); border:1.5px dashed var(--navy-line); color:transparent; }
  .avatar .shield{ position:absolute; bottom:-4px; right:-4px; background:var(--gold); border-radius:50%; width:15px; height:15px; display:flex; align-items:center; justify-content:center; font-size:8px; border:2px solid var(--navy-deep); }

  .count-row{ display:flex; align-items:center; justify-content:center; gap:14px; padding:10px 18px; }
  .count-num{ font-size:30px; line-height:1; color:var(--gold-bright); }
  .count-label{ font-size:10.5px; color:var(--muted); font-weight:700; letter-spacing:0.04em; text-align:left; line-height:1.5; }
  .count-label .out{ color:var(--out-red); }
  .rung-current .count-row{ background:rgba(216,178,76,0.06); border:1px solid rgba(216,178,76,0.25); border-radius:16px; }
  .rung-current .row{ background:rgba(216,178,76,0.06); border:1px solid rgba(216,178,76,0.25); border-radius:16px; padding:12px; }
  @media (prefers-reduced-motion: no-preference){
    .rung-current.just-unlocked .row{ animation:pulse 1.1s ease-out; }
  }
  @keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(216,178,76,0.35);} 100%{ box-shadow:0 0 0 14px rgba(216,178,76,0);} }

  .wipeout-band{
    background:repeating-linear-gradient(45deg, rgba(216,178,76,.08), rgba(216,178,76,.08) 10px, rgba(216,178,76,.02) 10px, rgba(216,178,76,.02) 20px);
    border-radius:10px; padding:10px 16px; font-size:10.5px; color:var(--gold-bright); font-weight:700; text-align:center;
  }

  .collapse-toggle{
    padding:10px 16px; border:1px dashed var(--navy-line); border-radius:10px; color:var(--muted);
    font-size:11px; font-weight:700; text-align:center; letter-spacing:0.03em;
  }

  .cap{ display:flex; flex-direction:column; align-items:center; gap:6px; padding-bottom:6px; cursor:default; }
  .cap-icon{ font-size:20px; filter:drop-shadow(0 0 12px rgba(243,210,122,0.6)); }
  .cap-label{ font-size:9.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold); font-weight:700; }

  .sheet-backdrop{ position:fixed; inset:0; background:rgba(2,6,16,0.6); z-index:4; }
  .sheet{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px;
    background:var(--navy-elevated); border-top:1px solid var(--navy-line); border-radius:20px 20px 0 0;
    padding:16px 20px 28px; box-shadow:0 -20px 50px rgba(0,0,0,0.5); z-index:5; max-height:70vh; overflow-y:auto;
  }
  .sheet-handle{ width:36px; height:4px; background:var(--navy-line); border-radius:4px; margin:0 auto 12px; }
  .sheet-title{ font-size:16px; font-weight:800; color:var(--text); }
  .sheet-note{ font-size:11px; color:var(--muted); margin:4px 0 14px; }
  .pop-bar{ display:flex; align-items:center; gap:10px; margin-bottom:9px; }
  .pop-team{ width:78px; font-size:11.5px; font-weight:600; color:var(--text); flex-shrink:0; }
  .pop-track{ flex:1; height:8px; background:var(--navy); border-radius:5px; overflow:hidden; }
  .pop-fill{ height:100%; background:linear-gradient(90deg, var(--gold), var(--gold-bright)); border-radius:5px; }
  .pop-pct{ font-size:10.5px; color:var(--muted); width:32px; text-align:right; flex-shrink:0; }
  .picks-divider{ font-size:10px; letter-spacing:0.06em; color:var(--muted); font-weight:700; text-transform:uppercase; margin:16px 0 8px; padding-top:12px; border-top:1px solid var(--navy-line); }
  .picks-list{ display:flex; flex-direction:column; gap:6px; }
  .pick-row{ display:flex; justify-content:space-between; gap:10px; font-size:12px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.04); }
  .pick-player{ color:var(--text); font-weight:600; }
  .pick-team{ color:var(--muted); }
  .locked-note{
    display:flex; align-items:flex-start; gap:8px; background:rgba(216,178,76,0.08); border:1px solid rgba(216,178,76,0.2);
    border-radius:10px; padding:10px 12px; font-size:11.5px; color:var(--gold-bright); line-height:1.5;
  }
  .cta{
    margin-top:14px; width:100%; padding:13px; background:var(--gold); color:var(--navy-deep); border:none;
    border-radius:12px; font-weight:800; font-size:13px;
  }
  .loading, .empty{ text-align:center; color:var(--muted); font-size:13px; padding:60px 20px; }
  .pro-gate{ text-align:center; padding:40px 24px; }
  .pro-gate .icon{ font-size:40px; margin-bottom:14px; }
  .pro-gate h2{ font-size:18px; margin:0 0 8px; color:var(--text); }
  .pro-gate p{ color:var(--muted); font-size:13px; line-height:1.6; margin:0 0 22px; }
  .pro-gate .cta{ display:block; width:100%; padding:13px; margin-top:10px; border-radius:12px; background:var(--gold); color:var(--navy-deep); border:none; font-weight:800; font-size:13px; text-decoration:none; }
  .pro-gate .ghost-btn{
    display:block; width:100%; padding:13px; margin-top:10px; border-radius:12px;
    background:transparent; border:1px solid rgba(148,163,184,.3); color:var(--muted);
    font-weight:700; font-size:13px; text-decoration:none; cursor:pointer;
  }
  .pro-gate .find-form{ margin-top:18px; text-align:left; }
  .nav-row{ display:flex; gap:8px; padding:0 16px 20px; }
  .nav-row a{ flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; text-align:center; text-decoration:none; padding:11px 4px; border-radius:12px; font-weight:700; font-size:9.5px; background:rgba(255,255,255,.04); border:1px solid var(--navy-line); color:var(--muted); transition:.15s; }
  .nav-row a:hover{ border-color:rgba(255,255,255,.2); color:var(--text); }
  .nav-row a svg{ width:16px; height:16px; }
  .find-form{ margin-top:4px; text-align:left; }
  .find-label{ font-size:11.5px; color:var(--muted); margin-bottom:8px; text-align:center; line-height:1.5; }
  .find-input{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--navy-line);
    background:var(--navy); color:var(--text); font-size:13px; margin-bottom:10px;
  }
  .find-input:focus{ outline:none; border-color:var(--gold); }
  .find-err{ color:var(--out-red); font-size:12px; margin-top:8px; display:none; line-height:1.5; }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="topbar">
    <div class="brand">The Arena<span id="poolSub">Premier League &middot; LMS</span></div>
    <div class="round-pill" id="roundPill">&hellip;</div>
  </div>

  <div class="hero">
    <div class="hero-count lms-display" id="heroCount">&ndash;</div>
    <div class="hero-label">Still Standing</div>
    <div class="hero-sub" id="heroSub"></div>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="dot alive"></span> Alive</div>
    <div class="legend-item"><span class="dot you"></span> You</div>
    <div class="legend-item"><span class="dot eliminated"></span> Eliminated</div>
    <div class="legend-item"><span class="dot life"></span> Joker used</div>
  </div>

  <div class="jump-btn" id="jumpBtn" style="display:none">Jump to your rung</div>

  <div id="content"><div class="loading">Loading the arena&hellip;</div></div>
</div>

<script>
var params = new URLSearchParams(window.location.search);
var poolId = params.get('pool');
var token = params.get('t');
var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function esc(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML.replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function initials(name){
  var parts = (name || '').trim().split(/\s+/);
  var a = parts[0] ? parts[0][0] : '';
  var b = parts.length > 1 ? parts[parts.length - 1][0] : '';
  return (a + b).toUpperCase();
}

function money(n){
  return '£' + Number(n).toFixed(2).replace(/\.00$/, '');
}

// "ROUND N" was ambiguous — nothing said whether N was the real league
// gameweek or just this pool's own round count, which matters a lot for a
// pool that started mid-season. Labelling as "GAMEWEEK N" makes clear it's
// the real league number (matches the pick screen/standings/emails, which
// already all say "Gameweek"), and flags this pool's actual first round
// explicitly rather than letting it look like an ordinary GW1.
function roundLabel(gw){
  var base = 'GAMEWEEK ' + gw;
  if(arenaData.pool.firstGw && gw === arenaData.pool.firstGw){
    return "POOL WEEK 1 &middot; " + base;
  }
  return base;
}

function renderProGate(upgradeUrl, fallbackUrl){
  var findFormHtml = '<div class="find-form">' +
      '<div class="find-label">We couldn\'t identify you from this link. Enter the email you joined with and we\'ll email you your personal link:</div>' +
      '<input type="email" class="find-input" id="findEmail" placeholder="you@example.com">' +
      '<button class="cta" style="margin-top:0" onclick="findMyLink()" id="findBtn">Find My Link</button>' +
      '<p class="find-err" id="findErr"></p>' +
    '</div>';
  var html = '<div class="pro-gate">' +
    '<div class="icon">⭐</div>' +
    '<h2>The Arena is a Pro feature</h2>' +
    '<p>Upgrade for £1 to unlock the visual standings and pick popularity for yourself — or carry on with the free plain-text ladder instead.</p>' +
    (upgradeUrl ? '<a class="cta" href="' + esc(upgradeUrl) + '">Go Pro — £1</a>' : findFormHtml) +
    '<a class="ghost-btn" href="' + esc(fallbackUrl) + '">Continue to free ladder &rarr;</a>' +
    '</div>';
  document.getElementById('content').innerHTML = html;
}

function findMyLink(){
  var email = document.getElementById('findEmail').value.trim();
  var errEl = document.getElementById('findErr');
  var btn = document.getElementById('findBtn');
  errEl.style.display = 'none';
  if(!email || !/^[^@]+@[^@]+\.[^@]+$/.test(email)){
    errEl.textContent = 'Please enter a valid email address.';
    errEl.style.display = 'block';
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Sending…';
  fetch('/api/lms-find-token', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ pool: poolId, email: email })
  })
  .then(function(r){ return r.json().then(function(d){ return {status:r.status, body:d}; }); })
  .then(function(res){
    if(res.status !== 200){
      btn.disabled = false;
      btn.textContent = 'Find My Link';
      errEl.textContent = "We couldn't find that email in this pool — try the personal link from your join confirmation email instead, or ask your organiser to resend it.";
      errEl.style.display = 'block';
      return;
    }
    // The link is emailed, never shown here, so only the real owner of that
    // email address can use it.
    btn.textContent = 'Email sent';
    errEl.style.color = '#34d399';
    errEl.textContent = "If that email is in this pool, we've just sent your personal link to it. Open it, then come back here to upgrade.";
    errEl.style.display = 'block';
  })
  .catch(function(){
    btn.disabled = false;
    btn.textContent = 'Find My Link';
    errEl.textContent = 'Something went wrong. Please try again.';
    errEl.style.display = 'block';
  });
}

var arenaData = null;
var collapsedBelow = null; // gw threshold; rounds below this are hidden until expanded
var firstLoad = true;
var POLL_MS = 60000; // the ladder only changes after kickoff and grading, so a slow refresh is plenty
var pollTimer = null;

function load(){
  if(!poolId) return;
  fetch('/api/lms-arena?pool=' + encodeURIComponent(poolId) + (token ? '&t=' + encodeURIComponent(token) : ''))
    .then(function(r){ return r.json().then(function(d){ return {status:r.status, body:d}; }); })
    .then(function(res){
      if(res.status !== 200){
        if(res.body.error === 'pro_required'){
          if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
          renderProGate(res.body.upgradeUrl, res.body.fallbackUrl);
          return;
        }
        document.getElementById('content').innerHTML = '<div class="empty">' + esc(res.body.error || 'Something went wrong loading this pool.') + '</div>';
        return;
      }
      arenaData = res.body;
      if(firstLoad){
        var recentSpan = 5;
        var lastGraded = arenaData.pool.lastGradedGw;
        collapsedBelow = Math.max(arenaData.pool.firstGw || 1, lastGraded - recentSpan + 1);
        scheduleDeadlineFlip();
        firstLoad = false;
      }
      render();
    })
    .catch(function(){
      if(firstLoad) document.getElementById('content').innerHTML = '<div class="empty">Something went wrong. Try refreshing.</div>';
    });
}

if(!poolId){
  document.getElementById('content').innerHTML = '<div class="empty">No pool specified.</div>';
} else {
  load();
  pollTimer = setInterval(load, POLL_MS);
}

function scheduleDeadlineFlip(){
  if(!arenaData || !arenaData.current.locked || !arenaData.current.deadline) return;
  var msUntil = new Date(arenaData.current.deadline).getTime() - Date.now();
  if(msUntil <= 0 || msUntil > 24 * 60 * 60 * 1000) return; // only bother for same-day deadlines
  setTimeout(function(){
    arenaData.current.locked = false;
    render(true);
  }, msUntil + 1000);
}

function formatDeadline(iso){
  return new Date(iso).toLocaleString('en-GB', { weekday:'short', hour:'2-digit', minute:'2-digit', timeZone:'Europe/London' });
}

function you(){
  return arenaData.players.find(function(p){ return p.isYou; }) || null;
}

function playersAsOfRound(g){
  return arenaData.players.filter(function(p){ return p.eliminatedWeek === null || p.eliminatedWeek >= g; });
}

// Initials render underneath always, as a guaranteed fallback — the photo
// is an <img> overlay that removes itself on load failure (corrupted data,
// oversized upload, etc.) rather than a CSS background-image with nothing
// behind it, which previously left a genuinely blank circle when a photo
// failed to load instead of falling back to initials.
function avatarPhotoHtml(avatarUrl){
  return avatarUrl ? '<img class="avatar-img" src="' + esc(avatarUrl) + '" onerror="this.remove()">' : '';
}

function avatarHtml(p, g){
  var isDead = p.eliminatedWeek === g;
  var label = p.displayName || p.name;
  var cls = 'avatar ' + (isDead ? 'eliminated' : 'alive') + (p.isYou ? ' you' : '');
  var title = isDead ? (p.name + ' — out GW' + p.eliminatedWeek) : p.name;
  var shield = (p.jokerUsedWeek === g) ? '<span class="shield">&#128737;</span>' : '';
  var content = isDead ? '💀' : esc(initials(label));
  var photo = isDead ? '' : avatarPhotoHtml(p.avatarUrl);
  return '<div class="' + cls + '" data-player-id="' + esc(String(p.id)) + '" title="' + esc(title) + '">' + content + photo + shield + '</div>';
}

// Current round's avatars. The joker shield is deliberately left off: whether someone's
// played their joker on this round's pick is strategy info that should
// stay hidden until the round is graded, same as the pick itself.
function currentAvatarHtml(p){
  var label = p.displayName || p.name;
  var cls = 'avatar alive' + (p.isYou ? ' you' : '');
  var content = esc(initials(label));
  var photo = avatarPhotoHtml(p.avatarUrl);
  return '<div class="' + cls + '" data-player-id="' + esc(String(p.id)) + '" title="' + esc(p.name) + '">' + content + photo + '</div>';
}

// Above this many players a circle per person turns the Arena into
// thousands of circles to scroll past, so each round shows numbers instead
// (plus your own circle, so you can still find yourself). Everyone's still
// listed by name on the Players table.
var BIG_POOL_SIZE = 100;
function isBigPool(){ return arenaData.startersCount > BIG_POOL_SIZE; }

function countRowHtml(inCount, outCount, viewerHtml){
  var label = 'still in';
  if(outCount) label += '<br><span class="out">' + outCount + ' out this week</span>';
  return '<div class="count-row"><span class="count-num lms-display">' + inCount + '</span>' +
    '<span class="count-label">' + label + '</span>' + (viewerHtml || '') + '</div>';
}

function render(justUnlocked){
  var d = arenaData;
  document.getElementById('poolSub').textContent = (d.pool.name || 'Last Man Standing') + ' · ' + (d.pool.leagueName || 'Premier League') + ' LMS';
  document.getElementById('heroCount').textContent = d.aliveCount;

  var subParts = ['of <b>' + d.startersCount + '</b> started'];
  if(d.pot){ subParts.push(money(d.pot.potential) + ' pot'); }
  document.getElementById('heroSub').innerHTML = subParts.join(' &middot; ');

  var pill = document.getElementById('roundPill');
  if(d.pool.status === 'finished'){
    pill.textContent = 'FINISHED';
  } else if(d.current.gw){
    pill.textContent = 'GW ' + d.current.gw;
  } else {
    pill.textContent = '—';
  }

  var jumpBtn = document.getElementById('jumpBtn');
  var viewer = you();
  if(viewer){
    jumpBtn.style.display = 'block';
    jumpBtn.onclick = function(){ jumpToYourRung(viewer); };
  }

  var html = '';

  // With column-reverse, whatever's FIRST in the DOM ends up at the BOTTOM
  // visually, and whatever's LAST ends up at the TOP — so to get oldest
  // round at the bottom rising up to the trophy at the top, we have to
  // build the HTML in exactly that order: past rounds first, current round
  // next, trophy last.

  // Past rounds, oldest first — becomes the bottom of the ladder.
  var lastGraded = d.pool.lastGradedGw;
  var roundByGw = {};
  d.rounds.forEach(function(r){ roundByGw[r.gw] = r; });

  var firstGw = d.pool.firstGw || 1;
  var hasCollapsed = collapsedBelow > firstGw;
  if(hasCollapsed){
    html += '<div class="rung collapse-toggle" id="collapseToggle" data-gw="collapse">Show earlier rounds (' + (collapsedBelow - firstGw) + ')</div>';
  }

  for(var g = collapsedBelow; g <= lastGraded; g++){
    var r = roundByGw[g];
    if(!r) continue;
    if(r.wipeout){
      html += '<div class="rung" data-gw="' + g + '"><div class="wipeout-band">♻️ ' + roundLabel(g) + ' — TOTAL WIPEOUT — nobody eliminated</div></div>';
      continue;
    }
    var playersHere = playersAsOfRound(g);
    html += '<div class="rung" data-gw="' + g + '">';
    html += '<div class="rung-meta"><span>' + roundLabel(g) + '</span></div>';
    if(isBigPool()){
      var outHere = playersHere.filter(function(p){ return p.eliminatedWeek === g; }).length;
      var viewerHere = playersHere.find(function(p){ return p.isYou; });
      html += countRowHtml(playersHere.length - outHere, outHere, viewerHere ? avatarHtml(viewerHere, g) : '');
    } else {
      html += '<div class="row">';
      playersHere.forEach(function(p){ html += avatarHtml(p, g); });
      html += '</div>';
    }
    html += '</div>';
  }

  // Current / in-progress round — sits just below the trophy.
  var pulseClass = (justUnlocked && !reducedMotion) ? ' just-unlocked' : '';
  html += '<div class="rung rung-current' + pulseClass + '" data-current="1">';
  html += '<div class="rung-meta"><span>' + (d.current.gw ? roundLabel(d.current.gw) : 'AWAITING NEXT GAMEWEEK') + '</span>' +
    // current.locked means picks are still *hidden* (before first kickoff),
    // so players can still pick — only after kickoff are picks locked in.
    (d.current.locked ? '<span>&middot; picks open' + (d.current.deadline ? ' until ' + formatDeadline(d.current.deadline) : '') + '</span>' : '<span>&middot; picks locked</span>') + '</div>';
  var currentPlayers = d.players.filter(function(p){ return p.eliminatedWeek === null; });
  if(isBigPool()){
    var viewerNow = currentPlayers.find(function(p){ return p.isYou; });
    html += countRowHtml(currentPlayers.length, 0, viewerNow ? currentAvatarHtml(viewerNow) : '') + '</div>';
  } else {
    html += '<div class="row">' + currentPlayers.map(currentAvatarHtml).join('') + '</div></div>';
  }

  // Trophy cap — appended last, so it lands at the very top as the
  // aspirational endpoint.
  if(d.pool.winner){
    html += '<div class="cap"><div class="cap-icon">🏆</div><div class="cap-label">' + esc(d.pool.winner) + ' wins!</div></div>';
  } else {
    html += '<div class="cap"><div class="cap-icon">🏆</div><div class="cap-label">Last one standing</div></div>';
  }

  var navHtml = '';
  if(token){
    navHtml = '<div class="nav-row">' +
      '<a href="/lms-pick.html?pool=' + poolId + '&t=' + token + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg><span>Pick</span></a>' +
      '<a href="/lms-matchday.html?pool=' + poolId + '&t=' + token + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg><span>Match Day</span></a>' +
      '<a href="/lms-table.html?pool=' + poolId + '&t=' + token + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="10" width="4" height="10"/><rect x="10" y="6" width="4" height="14"/><rect x="17" y="3" width="4" height="17"/></svg><span>Live Table</span></a>' +
      '<a href="/lms-players.html?pool=' + poolId + '&t=' + token + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18M3 12h18M3 19h18"/></svg><span>Players</span></a>' +
      '</div>';
  }
  document.getElementById('content').innerHTML = '<div class="arena" id="arenaList">' + html + '</div>' + navHtml;

  document.querySelectorAll('.rung[data-gw]').forEach(function(el){
    el.addEventListener('click', function(){
      var gw = this.getAttribute('data-gw');
      if(gw === 'collapse'){ expandCollapsed(); return; }
      openSheet(roundByGw[parseInt(gw, 10)]);
    });
  });
  document.querySelector('.rung-current').addEventListener('click', function(){ openCurrentSheet(); });

}

function expandCollapsed(){
  collapsedBelow = arenaData.pool.firstGw || 1;
  render();
}

function jumpToYourRung(viewer){
  if(collapsedBelow > (arenaData.pool.firstGw || 1) && viewer.eliminatedWeek !== null && viewer.eliminatedWeek < collapsedBelow){
    expandCollapsed();
  }
  setTimeout(function(){
    var targetGw = viewer.eliminatedWeek !== null ? viewer.eliminatedWeek : null;
    var el = targetGw ? document.querySelector('.rung[data-gw="' + targetGw + '"]') : document.querySelector('.rung-current');
    // Instant, not smooth: this is a functional jump-to-position control, and
    // smooth scrollIntoView is unreliable in some mobile webviews — landing
    // reliably in the right place matters more here than the animation.
    if(el) el.scrollIntoView({ behavior: 'auto', block: 'center' });
  }, 30);
}

// ---- Bottom sheet ----
function ensureSheet(){
  if(document.getElementById('sheet')) return;
  var backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';
  backdrop.id = 'sheetBackdrop';
  backdrop.style.display = 'none';
  backdrop.addEventListener('click', closeSheet);

  var sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.id = 'sheet';
  sheet.style.display = 'none';
  sheet.innerHTML = '<div class="sheet-handle"></div>' +
    '<div class="sheet-title" id="sheetTitle"></div>' +
    '<div class="sheet-note" id="sheetNote"></div>' +
    '<div id="sheetBody"></div>' +
    '<button class="cta" id="sheetClose">Back to the Arena</button>';
  document.body.appendChild(backdrop);
  document.body.appendChild(sheet);
  document.getElementById('sheetClose').addEventListener('click', closeSheet);
}

function closeSheet(){
  var sheet = document.getElementById('sheet');
  var backdrop = document.getElementById('sheetBackdrop');
  if(sheet) sheet.style.display = 'none';
  if(backdrop) backdrop.style.display = 'none';
}

function openSheetShell(){
  ensureSheet();
  document.getElementById('sheet').style.display = 'block';
  document.getElementById('sheetBackdrop').style.display = 'block';
}

function openCurrentSheet(){
  openSheetShell();
  document.getElementById('sheetTitle').textContent = arenaData.current.gw ? ('Gameweek ' + arenaData.current.gw) : 'Next gameweek';
  document.getElementById('sheetNote').textContent = '';
  var msg = arenaData.current.locked
    ? '🔒 Picks are hidden until this round’s deadline passes — no peeking mid-round, for anyone, including the organiser.'
    : '⏳ Kickoff’s happened, so picks are locked in — the popularity breakdown appears here once the round is fully graded after full-time.';
  document.getElementById('sheetBody').innerHTML = '<div class="locked-note">' + msg + '</div>';
}

function openSheet(r){
  openSheetShell();
  document.getElementById('sheetTitle').textContent = 'Gameweek ' + r.gw;
  var body = document.getElementById('sheetBody');

  if(r.wipeout){
    document.getElementById('sheetNote').textContent = '';
    body.innerHTML = '<div class="locked-note">♻️ Everyone still standing lost or drew this round, so under the rules it didn’t count — nobody was eliminated.</div>';
    return;
  }
  if(!r.popularity){
    document.getElementById('sheetNote').textContent = '';
    body.innerHTML = '<div class="locked-note">Popularity data isn’t available for this round.</div>';
    return;
  }

  document.getElementById('sheetNote').textContent = r.totalPlayers + ' picked this round' + (r.noPick ? ' · ' + r.noPick + ' didn’t pick' : '');
  var html = '';
  r.popularity.forEach(function(item){
    html += '<div class="pop-bar"><div class="pop-team">' + esc(item.team) + '</div>' +
      '<div class="pop-track"><div class="pop-fill" style="width:' + item.pct + '%"></div></div>' +
      '<div class="pop-pct">' + item.pct + '%</div></div>';
  });
  if(r.picks && r.picks.length){
    html += '<div class="picks-divider">Who picked what</div><div class="picks-list">';
    r.picks.forEach(function(p){
      html += '<div class="pick-row"><span class="pick-player">' + esc(p.displayName || p.name) + '</span><span class="pick-team">' + esc(p.team) + '</span></div>';
    });
    html += '</div>';
  }
  body.innerHTML = html;
}

</script>

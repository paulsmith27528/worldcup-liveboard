<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Your Last Man Standing Pool</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#020810;color:#fff;font-family:Arial,sans-serif;min-height:100vh}
  .wrap{max-width:480px;margin:0 auto;padding:48px 20px}
  .eyebrow{text-align:center;color:#ef4444;font-size:11px;font-weight:800;letter-spacing:3px;margin-bottom:10px}
  h1{text-align:center;font-size:30px;font-weight:900;margin:0 0 6px}
  .sub{text-align:center;color:#5b6b85;font-size:13px;margin-bottom:32px;line-height:1.6}
  .card{background:linear-gradient(150deg,rgba(4,15,34,.97),rgba(2,8,20,.99));border:1px solid rgba(239,68,68,.25);border-radius:18px;padding:28px}
  label{display:block;font-size:11px;font-weight:800;letter-spacing:1px;color:#94a3b8;margin-bottom:6px;margin-top:18px}
  label:first-child{margin-top:0}
  input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#fff;font-size:14px}
  input:focus{outline:none;border-color:rgba(255,213,74,.5)}
  .price{display:flex;justify-content:space-between;align-items:center;margin:26px 0 18px;padding:14px 16px;background:rgba(255,213,74,.06);border:1px solid rgba(255,213,74,.2);border-radius:10px}
  .price .lbl{font-size:12px;color:#94a3b8}
  .price .amt{font-size:20px;font-weight:900;color:#ffd54a}
  button{width:100%;padding:16px;border:none;border-radius:12px;background:linear-gradient(120deg,#ffd54a,#ffb84a);color:#1a1200;font-weight:900;font-size:14px;letter-spacing:.5px;cursor:pointer}
  .err{color:#ef4444;font-size:12px;margin-top:10px;text-align:center;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">☠ LAST MAN STANDING</div>
  <h1>Start Your Pool</h1>
  <p class="sub">One wrong pick and you're out. Winner takes all. Set up your Premier League pool in under a minute.</p>

  <div class="card">
    <form id="f">
      <label>POOL NAME</label>
      <input type="text" id="poolName" placeholder="e.g. Office LMS 2026/27" required>

      <label>YOUR NAME</label>
      <input type="text" id="organiser" placeholder="Your name" required>

      <label>YOUR EMAIL</label>
      <input type="email" id="email" placeholder="you@example.com" required>

      <div class="price">
        <span class="lbl">ONE-OFF SETUP FEE</span>
        <span class="amt">£4.99</span>
      </div>

      <button type="submit">Create My Pool →</button>
      <p class="err" id="err">Please fill in every field with a valid email address.</p>
    </form>
  </div>
</div>

<script>
document.getElementById('f').addEventListener('submit', function(e){
  e.preventDefault();
  var poolName = document.getElementById('poolName').value.trim();
  var organiser = document.getElementById('organiser').value.trim();
  var email = document.getElementById('email').value.trim();
  var err = document.getElementById('err');
  if(!poolName || !organiser || !/^[^@]+@[^@]+\.[^@]+$/.test(email)){
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';
  var url = '/api/lms-checkout?poolName=' + encodeURIComponent(poolName) +
    '&organiser=' + encodeURIComponent(organiser) +
    '&email=' + encodeURIComponent(email);
  window.location.href = url;
});
</script>
</body>
</html>
